<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust REPL</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace; background: #1a1b26; color: #c0caf5; display: flex; height: 100vh; overflow: hidden; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #16161e; }
::-webkit-scrollbar-thumb { background: #2f3346; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3d59a1; }
* { scrollbar-width: thin; scrollbar-color: #2f3346 #16161e; }
#editor-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#editor-header { padding: 8px 12px; background: #16161e; font-size: 12px; color: #565f89; border-bottom: 1px solid #2f3346; }
#code-input { flex: 1; background: #1a1b26; color: #c0caf5; border: none; padding: 12px; font-family: inherit; font-size: 14px; resize: none; outline: none; line-height: 1.6; }
#code-input::placeholder { color: #3b4261; }
#controls { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #2f3346; background: #16161e; }
button { background: #3d59a1; color: #c0caf5; border: none; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 4px; }
button:hover { background: #5474c4; }
button.reset { background: #3b4261; }
button.reset:hover { background: #565f89; }
button.plain { background: none; padding: 0; font-size: 11px; color: #565f89; }
button.plain:hover { background: none; color: #c0caf5; }
#right-panel { width: 480px; display: flex; flex-direction: column; border-left: 1px solid #2f3346; }
#output-panel { flex: 1; overflow-y: auto; padding: 12px; }
#output-header { padding: 8px 12px; background: #16161e; font-size: 12px; color: #565f89; border-bottom: 1px solid #2f3346; }
.output-line { padding: 4px 0; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.output-line.error { color: #f7768e; }
.output-line.stdout { color: #9ece6a; }
.output-line.meta { color: #565f89; font-size: 11px; }
#canvas-header { padding: 8px 12px; background: #16161e; font-size: 12px; color: #565f89; border-bottom: 1px solid #2f3346; border-top: 1px solid #2f3346; display: flex; justify-content: space-between; }
#canvas-panel { background: #1a1b26; display: flex; align-items: center; justify-content: center; }
#canvas-panel canvas { display: block; }
#timeline-panel { flex: 1; overflow-y: auto; border-top: 1px solid #2f3346; padding: 12px; }
#timeline-header { padding: 8px 12px; background: #16161e; font-size: 12px; color: #565f89; border-bottom: 1px solid #2f3346; border-top: 1px solid #2f3346; }
.timeline-entry { padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; }
.timeline-entry:hover { background: #2f3346; }
.timeline-entry .id { color: #7aa2f7; }
.timeline-entry .time { color: #565f89; }
.timeline-entry.error-entry .id { color: #f7768e; }
.status { padding: 4px 12px; font-size: 11px; color: #565f89; font-weight: 600; }
.canvas-ctrl { display: flex; align-items: center; gap: 8px; }
.canvas-ctrl label { font-size: 11px; cursor: pointer; }
.canvas-ctrl input[type="checkbox"] { display: none; }
.canvas-ctrl label { font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.canvas-ctrl label::before { content: ""; width: 12px; height: 12px; border: 1px solid #565f89; border-radius: 2px; display: inline-block; }
.canvas-ctrl input:checked + label::before { display: inline-block; background-color: #3d59a1; border-color: #3d59a1; background-image: linear-gradient(45deg, transparent calc(50% - 1px), #c0caf5 calc(50% - 1px), #c0caf5 calc(50% + 1px), transparent calc(50% + 1px)), linear-gradient(-45deg, transparent calc(50% - 1px), #c0caf5 calc(50% - 1px), #c0caf5 calc(50% + 1px), transparent calc(50% + 1px)); }
</style>
</head>
<body>

<div id="editor-panel">
    <div id="editor-header">Rust REPL — type code and press Ctrl+Enter to run</div>
    <textarea id="code-input" placeholder="fn main() { println!(\"hello\"); }" autofocus></textarea>
    <div id="controls">
        <button onclick="runCode()">Run (Ctrl+Enter)</button>
        <button class="reset" onclick="resetSession()">Reset Session</button>
        <span class="status" id="status">status: ready</span>
    </div>
</div>

<div id="right-panel">
    <div id="output-header">Output</div>
    <div id="output-panel"></div>
    <div id="canvas-header"><span>Canvas</span><span class="canvas-ctrl"><input type="checkbox" id="auto-clear" checked onchange="onAutoClear()"><label for="auto-clear">auto-clear</label><button class="reset plain" onclick="clearCanvas()">[clear]</button></span></div>
    <div id="canvas-panel"><canvas id="canvas"></canvas></div>
    <div id="timeline-header">Timeline</div>
    <div id="timeline-panel"></div>
</div>

<script>
const API = "";
const output = document.getElementById("output-panel");
const timeline = document.getElementById("timeline-panel");
const statusEl = document.getElementById("status");
const codeInput = document.getElementById("code-input");
const autoClear = document.getElementById("auto-clear");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CANVAS_W = 460;
const CANVAS_H = 300;
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

let sessionId = null;
let ws = null;

function connectWS() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws");

    ws.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);
            if (msg.commands) drawCommands(msg.commands);
        } catch (_) {}
    };

    ws.onclose = () => { setTimeout(connectWS, 2000); };
}

function drawCommands(commands) {
    for (const cmd of commands) {
        handleDraw(cmd);
    }
}

function handleDraw(cmd) {
    switch (cmd.draw) {
        case "clear":
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            break;
        case "line":
            ctx.strokeStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.lineWidth = cmd.w || 1;
            ctx.beginPath();
            ctx.moveTo(cmd.x1, cmd.y1);
            ctx.lineTo(cmd.x2, cmd.y2);
            ctx.stroke();
            break;
        case "rect":
            ctx.strokeStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.lineWidth = cmd.lw || 1;
            ctx.fillStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            if ((cmd.lw || 1) > 1) {
                ctx.strokeRect(cmd.x, cmd.y, cmd.w, cmd.h);
            }
            ctx.fillRect(cmd.x, cmd.y, cmd.w, cmd.h);
            break;
        case "circle":
            ctx.strokeStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.lineWidth = cmd.w || 1;
            ctx.beginPath();
            ctx.arc(cmd.x, cmd.y, cmd.radius, 0, Math.PI * 2);
            ctx.stroke();
            break;
        case "circleFill":
            ctx.fillStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.beginPath();
            ctx.arc(cmd.x, cmd.y, cmd.radius, 0, Math.PI * 2);
            ctx.fill();
            break;
        case "pixel":
            ctx.fillStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.fillRect(cmd.x, cmd.y, 1, 1);
            break;
        case "text":
            ctx.fillStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.font = "12px 'Fira Code', monospace";
            ctx.fillText(cmd.msg, cmd.x, cmd.y);
            break;
        case "arc":
            ctx.strokeStyle = rgba(cmd.r, cmd.g, cmd.b, cmd.a);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cmd.x, cmd.y, cmd.radius, cmd.start, cmd.end);
            ctx.stroke();
            break;
    }
}

function rgba(r, g, b, a) {
    return `rgba(${r || 255},${g || 255},${b || 255},${(a || 255) / 255})`;
}

function clearCanvas() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
}

function onAutoClear() {
    if (autoClear.checked) clearCanvas();
}

async function api(path, opts) {
    const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
    return res.json();
}

function appendOutput(type, text) {
    if (!text) return;
    const div = document.createElement("div");
    div.className = "output-line " + type;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
}

async function runCode() {
    let code = codeInput.value.trim();
    if (!code) return;

    if (autoClear.checked && !code.startsWith("_clear();")) {
        code = "_clear();" + code;
    }

    statusEl.textContent = "status: running...";
    const start = Date.now();

    let result;
    try {
        result = await api("/run", {
            method: "POST",
            body: JSON.stringify({ sessionId, code }),
        });
    } catch (e) {
        appendOutput("error", "Connection failed: " + e.message);
        statusEl.textContent = "status: error";
        return;
    }

    const dur = Date.now() - start;

    if (result.ok) {
        appendOutput("stdout", result.stdout.trimEnd());
        appendOutput("meta", `✓ cmd#${result.commandId}  compile:${result.compileMs}ms  run:${result.runMs}ms  total:${dur}ms`);
    } else {
        appendOutput("error", result.stderr.trimEnd());
        appendOutput("meta", `✗ cmd#${result.commandId}  total:${dur}ms`);
    }

    statusEl.textContent = result.ok
        ? `status: ok \u2713 compile:${result.compileMs}ms  run:${result.runMs}ms  total:${dur}ms`
        : "status: compile error";
    refreshTimeline();
    codeInput.value = "";
    codeInput.focus();
}

function addTimelineEntry(cmd, lastResult) {
    const div = document.createElement("div");
    div.className = "timeline-entry" + (lastResult === false ? " error-entry" : "");
    div.innerHTML = `<span class="id">#${cmd.commandId}</span><span class="time">${cmd.code.slice(0,40)}</span>`;
    div.onclick = async () => {
        appendOutput("meta", `--- replay command #${cmd.commandId} ---`);
        let session;
        try { session = await api("/session/" + sessionId); } catch (_) { return; }
        const replayCommands = session.commands.slice(0, cmd.commandId + 1);
        let src = "fn main() {\n";
        for (const c of replayCommands) {
            let code = c.code.trim();
            if (!code.endsWith(";") && !code.endsWith("}")) code += ";";
            src += "    " + code.replace(/\n/g, "\n    ") + "\n";
        }
        src += "}\n";
        appendOutput("meta", src.trimEnd());
    };
    timeline.prepend(div);
}

async function refreshTimeline() {
    if (!sessionId) return;
    let session;
    try { session = await api("/session/" + sessionId); } catch (_) { return; }
    timeline.innerHTML = "";
    for (let i = session.commands.length - 1; i >= 0; i--) {
        addTimelineEntry(session.commands[i], null);
    }
}

async function resetSession() {
    if (sessionId) await api("/session/" + sessionId, { method: "DELETE" });
    sessionId = null;
    output.innerHTML = "";
    timeline.innerHTML = "";
    clearCanvas();
    appendOutput("meta", "Session reset. Create new session...");
    initSession();
}

async function initSession() {
    try {
        const data = await api("/session", { method: "POST" });
        sessionId = data.sessionId;
        statusEl.textContent = "session: " + sessionId.slice(0,8);
        appendOutput("meta", "Session: " + sessionId);
    } catch (e) {
        statusEl.textContent = "offline";
        appendOutput("error", "Cannot reach runtime");
    }
}

codeInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runCode();
    }
});

connectWS();
initSession();
</script>
</body>
</html>
